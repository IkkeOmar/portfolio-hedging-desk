name: CI

on:
  push:
  pull_request:
  # Lets anyone re-run the suite on demand from the Actions tab, without
  # pushing a commit. Useful for a public repository where a reader wants
  # to see the result on their own fork.
  workflow_dispatch:

# The workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result, even if one of them fails.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Journals and reports go to the runner's scratch directory, so a CI run
      # never leaves untracked files behind in the checkout.
      #
      # NOTE: this is the runner's default environment variable, not the
      # `runner` context. The `runner` context is NOT available in
      # `jobs.<job_id>.env` (only in `jobs.<job_id>.steps.*`), and using it
      # here makes GitHub reject the whole workflow at validation time: the
      # run is created, concludes instantly, and no job ever starts.
      CI_ARTIFACTS: $RUNNER_TEMP/hedge-ci

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the complete "everything you need to run the
          # tests" file for this repo, so it is the single source of truth.
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Run the desk entry point
        # The desk runs on the bundled synthetic dataset: no API key, no
        # network, no broker account.
        run: |
          python scripts/run_desk.py \
            --config examples/holdings.example.yaml \
            --journal "$CI_ARTIFACTS/journal-desk"

      - name: Run the backtest entry point
        # scripts/backtest.py exits 1 when a hedging gate fails. That is BY
        # DESIGN: the gates legitimately fail on the synthetic fixture
        # (gate 2, Newey-West HAC t = 0.51 < 1.96) and the report is still
        # written. A non-zero exit here is not a build failure, so this step
        # is allowed to fail; the next step asserts the reports exist.
        continue-on-error: true
        run: |
          python scripts/backtest.py \
            --config examples/holdings.example.yaml \
            --journal "$CI_ARTIFACTS/journal-backtest" \
            --out "$CI_ARTIFACTS/reports"

      - name: Audit the documented claims
        # The claim audit runs the desk, compares every number in the
        # documentation against a live run, checks every referenced path
        # against the filesystem, and checks every test count against what
        # pytest collects. It runs here against the report this job just
        # produced, so a number that drifts out of the documentation fails
        # the build instead of shipping.
        #
        # Only on one matrix entry: the audit is a property of the
        # repository, not of an interpreter, and running it twice just
        # doubles the wall clock.
        if: matrix.python-version == '3.11'
        run: python scripts/audit_claims.py --report "$CI_ARTIFACTS/reports/evaluation.json"

      - name: Check out the lab repository
        # The thread quotes numbers from BOTH repositories: the lab's gate
        # verdicts and trial counts come from the lab's published sweep
        # outputs, and the desk's come from this repository. The thread
        # audit needs both to check anything, so the lab is checked out
        # here.
        #
        # The ref is PINNED to the published commit, not to the branch
        # head. A branch head moves, and a thread whose numbers are
        # checked against a moving target is a thread whose audit can
        # fail for a reason nobody can see in the diff. Bump the pin
        # deliberately, in the same commit as any lab number the thread
        # quotes.
        #
        # The lab's public history is ONE commit and is recreated rather
        # than force-pushed, so a pin names a commit that exists and that
        # will keep existing. The previous pin (82669b6) returns "No
        # commit found for SHA", which is the intended state.
        if: matrix.python-version == '3.11'
        uses: actions/checkout@v4
        with:
          repository: IkkeOmar/hedging-agent-public
          ref: f5c4f25b28f6ce2b5e11b5d32b1b7d92025c6575
          path: .lab

      - name: Audit the thread against both repositories
        # The thread is the one artefact that leaves this repository and
        # lands in front of strangers, so its numbers are checked against
        # the artefacts that produced them: the desk's report and ledgers
        # here, the lab's published outputs and ledgers in the checkout
        # above. A number that drifts out of the thread fails the build.
        #
        # --strict makes an unmatched number a failure rather than a
        # warning: a number nobody can source is not published.
        if: matrix.python-version == '3.11'
        run: python scripts/audit_thread.py --lab-repo .lab --strict

      - name: Assert the backtest reports were written
        # The proof that the entry point really ran end to end: the report is
        # written whether the gates pass or fail.
        run: |
          test -f "$CI_ARTIFACTS/reports/evaluation.json"
          test -f "$CI_ARTIFACTS/reports/evaluation.md"
          test -s "$CI_ARTIFACTS/reports/evaluation.json"
          test -s "$CI_ARTIFACTS/reports/evaluation.md"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert 'gates' in d and 'verdict' in d, d.keys(); print('verdict:', d['verdict'], '| short_circuited_at:', d.get('short_circuited_at'))" "$CI_ARTIFACTS/reports/evaluation.json"
          echo "--- reports written ---"
          ls -l "$CI_ARTIFACTS/reports"

  dashboard:
    name: dashboard (browser click-through)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dashboard extra
        # Streamlit and Plotly are an OPTIONAL extra. The core package and
        # the core suite install and run without them; this job installs
        # the extra and runs the UI tests for real, so the `importorskip`
        # in the test files never hides a broken dashboard in CI.
        #
        # It installs the DECLARED FLOOR, not the latest release. A job
        # that installs `latest` cannot catch a floor that is too low:
        # the newest Streamlit accepts the `width` parameter and the theme
        # keys that the declared floor rejects, so the defect only appears
        # on the version a reader is most likely to have.
        #
        # The floor is measured, not guessed: 1.55.0 is the first Streamlit
        # that has the `width` parameter on st.button, st.dataframe AND
        # st.plotly_chart (1.49.0 / 1.49.0 / 1.51.0) AND accepts every key
        # in .streamlit/config.toml (theme.metricValueFontSize is rejected
        # through 1.54.0). The dashboard also feature-detects the parameter
        # at runtime, so a reader on an older Streamlit gets the app
        # instead of a TypeError. See dashboard/compat.py.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The FLOOR, exactly -- not ">= the floor".
          #
          # `streamlit>=1.55.0` installs the NEWEST Streamlit, and a CI job
          # that installs the newest cannot catch a too-low floor: the bug
          # only appears on the version nobody is testing. Pinning the floor
          # makes the CI answer the question it exists to answer -- does the
          # app work on the oldest Streamlit this repo claims to support?
          #
          # 1.55.0 is the floor because it is the first version that accepts
          # theme.metricValueFontSize (rejected through 1.54.0) and has
          # st.button(width=...) (1.49.0) and st.plotly_chart(width=...)
          # (1.51.0). The dashboard also feature-detects `width` at
          # runtime, so a reader on an older Streamlit gets the app instead
          # of a TypeError. See dashboard/compat.py.
          python -m pip install "streamlit==1.55.0" "plotly>=5.20" playwright
          python -m pip install -e .

      - name: Install the browser
        # The browser tests drive a real chromium against a real Streamlit
        # server: Streamlit's own test harness cannot click a tab, because
        # a tab is a container and not a widget.
        run: playwright install --with-deps chromium

      - name: Run the dashboard tests
        # Two layers: the script-level harness (AppTest) and the browser
        # layer (Playwright). Both skip silently when their dependency is
        # missing, so this job is what makes "the dashboard works" a claim
        # the build enforces rather than a claim the README makes.
        run: python -m pytest tests/test_dashboard.py tests/test_dashboard_browser.py -v

      - name: Assert the dashboard started and served the report
        # The app must not need a key, a network or a broker. If the
        # report is missing the dashboard shows a warning instead of the
        # desk, and this catches that.
        run: |
          test -f reports/evaluation.json
          test -f reports/equity.csv
          python -c "import json,sys; d=json.load(open('reports/evaluation.json')); assert d['gates'], 'no gates in the report'; print('gates:', len(d['gates']), '| verdict:', d['verdict'])"
